# Standalone Jellyfin Server (for non-HA OS hosts).
# On Home Assistant OS, prefer the Jellyfin Server add-on instead.
services:
  jellyfin:
    image: jellyfin/jellyfin:12.4
    container_name: jellyfin
    restart: unless-stopped
    ports:
      - "8096:8096"
    volumes:
      - ./jellyfin-data/config:/config
      - ./jellyfin-data/cache:/cache
      - /media:/media
    environment:
      - JELLYFIN_PublishedServerUrl=http://127.0.0.1:8096
