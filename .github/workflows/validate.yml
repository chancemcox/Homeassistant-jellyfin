name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"

jobs:
  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: HACS Action
        uses: hacs/action@main
        with:
          category: integration
          # Repository description/topics/license are GitHub settings that must be
          # set on the repo after merge; ignore them so PR validation can pass.
          ignore: description topics license

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Hassfest
        uses: home-assistant/actions/hassfest@master

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: pip install pytest pytest-asyncio aiohttp

      - name: Run unit tests
        run: python -m pytest tests/ -q

  ha-docker-smoke:
    name: Home Assistant Docker smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Make smoke script executable
        run: chmod +x scripts/ha_docker_smoke.sh

      - name: Install custom component in Home Assistant Docker and smoke-test
        env:
          HA_IMAGE: ghcr.io/home-assistant/home-assistant:2024.11.0
          TIMEOUT_SECS: "360"
        run: ./scripts/ha_docker_smoke.sh
